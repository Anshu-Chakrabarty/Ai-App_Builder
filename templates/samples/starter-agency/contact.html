<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — Harbor Studio</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap brand-row">
      <strong class="brand">Harbor Studio</strong>
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <section class="contact">
    <div class="wrap">
      <h1>Contact us</h1>
      <p>Share a bit about your project and we’ll reply within one business day.</p>
      <form>
        <label>Name</label>
        <input type="text" placeholder="Your name" />
        <label>Email</label>
        <input type="email" placeholder="you@company.com" />
        <label>Message</label>
        <textarea rows="4" placeholder="What are you building?"></textarea>
        <button class="btn" type="submit">Send message</button>
      </form>
      <p>hello@harbor.studio · +1 (555) 014-2200</p>
    </div>
  </section>

  <footer class="site-footer">
    <div class="wrap"><p>© Harbor Studio</p></div>
  </footer>
</body>
</html>
